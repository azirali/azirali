name: Profile 3D contribution graph

# Renders an isometric 3D map of the last year of contributions and commits
# the SVGs to profile-3d-contrib/ (embedded in README.md). Runs nightly.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate 3D contribution graphs
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          MAX_REPOS: 100
          # Dark and light themes in the profile's palette
          SETTING_JSON: .github/profile-3d-settings.json

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh 3D contribution graph"
          git push
