name: Contribution snake

# Generates the animated contribution snake on the `output` branch
# (embedded in README.md from there, so the main branch stays clean).
on:
  schedule:
    - cron: "43 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#1F5EFF&color_dots=#E6ECF7,#C7D7FE,#93B4FD,#5B8DF8,#1F5EFF
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#22D3EE&color_dots=#16213A,#163A8A,#2056D6,#2F7BFF,#7DD3FC
            dist/github-contribution-grid-snake.gif?color_snake=orange&color_dots=#bfd6f6,#8dbdff,#64a1f4,#4b91f1,#3c7dd9

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
