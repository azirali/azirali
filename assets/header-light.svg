<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Olzhas Azirali: full-stack developer, founder of AZIRAL, open-source author">
  <style>
    .name { font: 700 64px system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #0A0A0A; letter-spacing: -1.5px; }
    .kicker { font: 600 15px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #0047FF; letter-spacing: 3px; }
    .role { font: 400 30px system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #6B6B6B; opacity: 0; animation: role 9s infinite; }
    .meta { font: 400 15px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #6B6B6B; }
    .cursor { fill: #0047FF; animation: blink 1s steps(1) infinite; }
    .grid line { stroke: #E8E5DF; stroke-width: 1; }
    .draw { stroke: #0047FF; stroke-width: 3; stroke-linecap: round; stroke-dasharray: var(--len); stroke-dashoffset: var(--len); animation: draw 1s ease-out forwards; }
    .star { fill: #0047FF; opacity: 0; animation: twinkle 3s ease-in-out infinite; }
    .glow { animation: pulse 6s ease-in-out infinite; transform-origin: 160px 170px; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes twinkle { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
    @keyframes pulse { 0%, 100% { opacity: .45; transform: scale(1); } 50% { opacity: .8; transform: scale(1.08); } }
    @keyframes role { 0% { opacity: 0; transform: translateY(8px); } 4%, 29% { opacity: 1; transform: translateY(0); } 33%, 100% { opacity: 0; transform: translateY(-8px); } }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .draw { stroke-dashoffset: 0; animation: none; }
      .star { opacity: 1; animation: none; }
      .glow { animation: none; }
      .role { animation: none; }
      .role:first-of-type { opacity: 1; }
      .cursor { animation: none; }
    }
  </style>
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7FA3FF" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#7FA3FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#F5F3EE" stop-opacity="0"/>
      <stop offset="100%" stop-color="#F5F3EE" stop-opacity="1"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1200" height="320" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="#F5F3EE"/>
    <g class="grid">
      <line x1="0" y1="0" x2="0" y2="320"/><line x1="40" y1="0" x2="40" y2="320"/><line x1="80" y1="0" x2="80" y2="320"/><line x1="120" y1="0" x2="120" y2="320"/><line x1="160" y1="0" x2="160" y2="320"/><line x1="200" y1="0" x2="200" y2="320"/><line x1="240" y1="0" x2="240" y2="320"/><line x1="280" y1="0" x2="280" y2="320"/><line x1="320" y1="0" x2="320" y2="320"/><line x1="360" y1="0" x2="360" y2="320"/><line x1="400" y1="0" x2="400" y2="320"/><line x1="440" y1="0" x2="440" y2="320"/><line x1="480" y1="0" x2="480" y2="320"/><line x1="520" y1="0" x2="520" y2="320"/><line x1="560" y1="0" x2="560" y2="320"/><line x1="600" y1="0" x2="600" y2="320"/><line x1="640" y1="0" x2="640" y2="320"/><line x1="680" y1="0" x2="680" y2="320"/><line x1="720" y1="0" x2="720" y2="320"/><line x1="760" y1="0" x2="760" y2="320"/><line x1="800" y1="0" x2="800" y2="320"/><line x1="840" y1="0" x2="840" y2="320"/><line x1="880" y1="0" x2="880" y2="320"/><line x1="920" y1="0" x2="920" y2="320"/><line x1="960" y1="0" x2="960" y2="320"/><line x1="1000" y1="0" x2="1000" y2="320"/><line x1="1040" y1="0" x2="1040" y2="320"/><line x1="1080" y1="0" x2="1080" y2="320"/><line x1="1120" y1="0" x2="1120" y2="320"/><line x1="1160" y1="0" x2="1160" y2="320"/><line x1="1200" y1="0" x2="1200" y2="320"/><line x1="0" y1="0" x2="1200" y2="0"/><line x1="0" y1="40" x2="1200" y2="40"/><line x1="0" y1="80" x2="1200" y2="80"/><line x1="0" y1="120" x2="1200" y2="120"/><line x1="0" y1="160" x2="1200" y2="160"/><line x1="0" y1="200" x2="1200" y2="200"/><line x1="0" y1="240" x2="1200" y2="240"/><line x1="0" y1="280" x2="1200" y2="280"/><line x1="0" y1="320" x2="1200" y2="320"/>
    </g>
    <rect x="600" width="600" height="320" fill="url(#fade)"/>
    <circle class="glow" cx="160" cy="170" r="190" fill="url(#glow)"/>
    <g>
      <line class="draw" style="--len:189.7;animation-delay:0.2s" x1="160" y1="70" x2="100" y2="250"/>
      <line class="draw" style="--len:189.7;animation-delay:0.55s" x1="160" y1="70" x2="220" y2="250"/>
      <line class="draw" style="--len:66.0;animation-delay:0.8999999999999999s" x1="127" y1="190" x2="193" y2="190"/>
      <circle class="star" style="animation-delay:1.2s" cx="160" cy="70" r="6"/>
      <circle class="star" style="animation-delay:1.45s" cx="100" cy="250" r="6"/>
      <circle class="star" style="animation-delay:1.7s" cx="220" cy="250" r="6"/>
      <circle class="star" style="animation-delay:1.95s" cx="127" cy="190" r="6"/>
      <circle class="star" style="animation-delay:2.2s" cx="193" cy="190" r="6"/>
    </g>
    <text class="kicker" x="300" y="92">ASTANA, KAZAKHSTAN · AZIRAL.COM</text>
    <text class="name" x="296" y="160">Olzhas Azirali</text>
    <text class="role" style="animation-delay:0s" x="300" y="220">Full-stack developer</text>
    <text class="role" style="animation-delay:3s" x="300" y="220">Founder of AZIRAL</text>
    <text class="role" style="animation-delay:6s" x="300" y="220">Open-source author</text>
    <rect class="cursor" x="300" y="246" width="14" height="3"/>
    <text class="meta" x="1160" y="288" text-anchor="end">building products from idea to production</text>
  </g>
</svg>
